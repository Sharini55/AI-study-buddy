name: Build and deploy Python app to Azure Web App - AIStudyBuddy
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          # MATCH THIS to your Azure App Service Python Runtime (Portal shows Python 3.13)
          python-version: '3.13'
      - name: Create virtual environment and install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !__pycache__
            !.git
            !.github
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_527590F52563462D8D18D9B9D563ADC0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0B732F746656414091981560F42AF258 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FC8FA4F1F7634C7CBB68FD9B48AB9C33 }}
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'AIStudyBuddy'
          slot-name: 'Production'
          # Calls the venv's python binary directly with absolute paths — no
          # 'source'/activation step, so this can't fail on sh-vs-bash
          # differences in how the platform invokes the startup command.
          startup-command: '/home/site/wwwroot/antenv/bin/python -m streamlit run /home/site/wwwroot/app.py --server.port 8000 --server.address 0.0.0.0'
